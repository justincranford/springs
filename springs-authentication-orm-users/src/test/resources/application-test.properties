spring.application.name=@artifactId@

#logging.level.root=WARN
logging.level.root=INFO
#logging.level.root=DEBUG
#logging.level.root=TRACE
#logging.level.org.hibernate=DEBUG
logging.level.com.github.justincranford.springs.authenticationorm.users.authentication.provider=TRACE
logging.level.com.github.justincranford.springs.authenticationorm.users.authentication.service=TRACE

server.port = 8443
server.address = localhost
#server.address = 127.0.0.1
#server.address = [::1]

# HTTPS auto-configuration
server.ssl.auto-config.enabled = true
server.ssl.auto-config.algorithm = EC-P384

management.tracing.sampling.probability=1.0

#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.datasource.url=jdbc:h2:mem:postgresql_mode_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
#spring.datasource.username=SPRING_DATABASE_USERNAME_H2_POSTGRESQLDIALECT
#spring.datasource.password=SPRING_DATABASE_PASSWORD_H2_POSTGRESQLDIALECT

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.datasource.url=jdbc:h2:mem:h2_mode_test;DB_CLOSE_DELAY=-1
spring.datasource.username=SPRING_DATABASE_USERNAME_H2_H2DIALECT
spring.datasource.password=SPRING_DATABASE_PASSWORD_H2_H2DIALECT

# Not very flexible way to control DDL
spring.jpa.generate-ddl=true
#spring.jpa.generate-ddl=false
# Very flexible way to control DDL
#spring.jpa.hibernate.ddl-auto=none
#spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.hibernate.ddl-auto=create-drop

# Basic logging to console only, not very flexible, equivalent to `hibernate.show_sql=true`
#spring.jpa.show-sql=true
# Log log log
#hibernate.show_sql=true
# Advanced logging to log framework, very flexible
logging.level.org.hibernate.SQL=DEBUG
# Newer way to log bind values
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# Older way to log bind values
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# Pretty print PreparedStatement
spring.jpa.properties.hibernate.format_sql=true
# Example: /* insert for com.github.justincranford.springs.persistenceorm.users.person.PersonOrm.languages */
#spring.jpa.properties.hibernate.use_sql_comments=true
