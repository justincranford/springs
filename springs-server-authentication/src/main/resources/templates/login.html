<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="/default-ui.css" rel="stylesheet"/>
    <script type="text/javascript" src="/login/webauthn.js"></script>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <form class="card p-4 shadow-sm" method="post" action="/login">
                <h2 class="card-title text-center mb-4">Username Password</h2>

                <div class="mb-3">
                    <label for="username" class="form-label">Email or Username</label>
                    <input type="text" id="username" name="username" value="admin1" class="form-control" placeholder="Username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" value="admin1password" class="form-control" placeholder="Password" autocomplete="password webauthn" required>
                </div>

                <input type="hidden" name="_csrf" th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-primary w-100">Sign in</button>
            </form>

            <div class="card p-4 shadow-sm mt-4">
                <h2 class="card-title text-center mb-4">WebAuthn</h2>
                <button id="passkey-signin" type="button" class="btn btn-secondary w-100">Sign in</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
