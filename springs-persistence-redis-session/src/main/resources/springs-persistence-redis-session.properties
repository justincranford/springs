spring.application.name=@artifactId@

#logging.level.root=WARN
logging.level.root=INFO
#logging.level.root=DEBUG
#logging.level.root=TRACE

server.port = 8443
server.address = localhost

# HTTPS auto-configuration
server.ssl.auto-config.enabled = true
server.ssl.auto-config.algorithm = EC-P384

management.endpoints.web.exposure.include=*
#management.endpoints.web.exposure.include=prometheus

#micrometer.observations.annotations.enabled=true
management.observations.annotations.enabled=true

management.tracing.enabled=true
management.tracing.sampling.probability=0.1

#management.metrics.distribution.percentiles-histogram.http.server.requests=true
#logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# TODO
spring.session.store-type=redis
#spring.redis.host=localhost
#spring.redis.port=6379
#spring.security.session.create-session=always

spring.redis.database=0
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.timeout=5000ms
server.servlet.session.timeout=3600
spring.session.redis.namespace=person:
