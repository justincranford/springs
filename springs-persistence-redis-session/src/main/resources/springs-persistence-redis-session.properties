spring.application.name=@artifactId@

#logging.level.root=WARN
logging.level.root=INFO
#logging.level.root=DEBUG
#logging.level.root=TRACE

server.port = 8443
server.address = localhost

# HTTPS auto-configuration
server.ssl.auto-config.enabled = true
server.ssl.auto-config.algorithm = EC-P384

management.endpoints.web.exposure.include=*
#management.endpoints.web.exposure.include=prometheus

#micrometer.observations.annotations.enabled=true
management.observations.annotations.enabled=true

management.tracing.enabled=true
management.tracing.sampling.probability=0.1

#management.metrics.distribution.percentiles-histogram.http.server.requests=true
#logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# TODO
spring.session.store-type=redis
#spring.redis.host=localhost
#spring.redis.port=6379
#spring.security.session.create-session=always

spring.redis.database=0
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.timeout=5000ms
server.servlet.session.timeout=3600
spring.session.redis.namespace=person:


#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#spring.datasource.url=jdbc:h2:mem:postgresql_mode_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
#spring.datasource.username=SPRING_DATABASE_USERNAME_H2_POSTGRESQLDIALECT
#spring.datasource.password=SPRING_DATABASE_PASSWORD_H2_POSTGRESQLDIALECT

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.datasource.url=jdbc:h2:mem:h2_mode_test;DB_CLOSE_DELAY=-1
spring.datasource.username=SPRING_DATABASE_USERNAME_H2_H2DIALECT
spring.datasource.password=SPRING_DATABASE_PASSWORD_H2_H2DIALECT

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
hibernate.show_sql=true
#spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
#logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.orm.jdbc.bind=TRACE
